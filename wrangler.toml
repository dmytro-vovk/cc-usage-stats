# Cloudflare Worker serving the static site at https://ccusagestats.app
# (Workers static assets: site/ as-is, _headers honoured, no code). Publish
# with scripts/deploy-site.sh; needs `npx wrangler login` once.
name = "ccusagestats"
compatibility_date = "2026-11-09"
# One canonical host: no *.workers.dev address, no preview URLs.
workers_dev = false
preview_urls = false

[assets]
directory = "./site"

# Wrangler creates the DNS record and certificate for the custom domain.
[[routes]]
pattern = "ccusagestats.app"
custom_domain = true
