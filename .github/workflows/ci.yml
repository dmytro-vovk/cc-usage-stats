name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build + unit tests
    # Newest Xcode GitHub offers. Local builds and releases use Xcode 27,
    # which runners don't have yet; anything 26+ (Swift 6.2+) at least honours
    # the project's SWIFT_DEFAULT_ACTOR_ISOLATION / approachable-concurrency
    # settings. Xcode 16 ignored them, so CI was testing different
    # concurrency semantics than what ships.
    runs-on: macos-26
    # A healthy run takes ~5 min. Without a cap, a hung test host sits
    # until GitHub's 6-hour limit.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than the image default, so the toolchain only changes
      # when we change it.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build (Release)
        run: |
          xcodebuild build \
            -scheme CCUsageStats \
            -configuration Release \
            -destination 'platform=macOS' \
            -project CCUsageStats/CCUsageStats.xcodeproj \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            MACOSX_DEPLOYMENT_TARGET=13.5

      # Per-test timeouts make xcodebuild kill and name a test that never
      # returns, instead of hanging silently (it prints per-test output only
      # at the end). The result bundle is kept even on failure or timeout.
      - name: Run unit tests
        timeout-minutes: 15
        run: |
          xcodebuild test \
            -scheme CCUsageStats \
            -destination 'platform=macOS' \
            -project CCUsageStats/CCUsageStats.xcodeproj \
            -only-testing:CCUsageStatsTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            MACOSX_DEPLOYMENT_TARGET=13.5

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
